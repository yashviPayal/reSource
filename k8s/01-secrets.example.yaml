apiVersion: v1
kind: Secret
metadata:
  name: resource-secrets
  namespace: resource-app
type: Opaque
stringData:
  # ==============================================================================
  # TEMPLATE: Copy this file to 01-secrets.yaml and replace with your values.
  # Note: 01-secrets.yaml is ignored by Git to prevent leaking credentials.
  # ==============================================================================

  # JWT Secret for cross-service authentication
  JWT_SECRET: "your_jwt_secret_key_here_min_32_characters"

  # Resend API Key for Email Delivery
  RESEND_API_KEY: "re_your_resend_api_key_here"

  # Database Connection String
  # [OPTION 1: Local PostgreSQL in Minikube/Docker]
  # DATABASE_URL: "postgresql://postgres:postgres@postgres-local:5432/resource_db"
  # [OPTION 2: Managed Supabase Cloud]
  DATABASE_URL: "postgresql://postgres.xxx:your_password@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"

  # RabbitMQ Credentials
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
