apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: resource-app
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: cna-resource-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4004
          env:
            - name: PORT
              value: "4004"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: resource-config
                  key: NODE_ENV
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: resource-config
                  key: RABBITMQ_URL
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resource-secrets
                  key: RESEND_API_KEY
            - name: RESEND_FROM_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: resource-config
                  key: RESEND_FROM_EMAIL
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: resource-config
                  key: APP_NAME
          resources:
            requests:
              cpu: "30m"
              memory: "96Mi"
            limits:
              cpu: "150m"
              memory: "192Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: resource-app
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 4004
      targetPort: 4004
