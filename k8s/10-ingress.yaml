apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resource-ingress
  namespace: resource-app
  annotations:
    # Traefik (default in K3s) and Nginx Ingress compatibility
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          # Route all incoming backend traffic on port 80 directly to API Gateway
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
