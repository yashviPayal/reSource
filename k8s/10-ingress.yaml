apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resource-ingress
  namespace: resource-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - resource-backend.mentalorbit.tech
      secretName: resource-backend-tls
  rules:
    - host: resource-backend.mentalorbit.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
