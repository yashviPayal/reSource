apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: resource-app
  labels:
    app: resource-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
    spec:
      containers:
        - name: resource-service
          image: cna-resource-resource-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: resource-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resource-secrets
                  key: DATABASE_URL
            - name: DATABASE_SSL
              valueFrom:
                configMapKeyRef:
                  name: resource-config
                  key: DATABASE_SSL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: resource-secrets
                  key: JWT_SECRET
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: resource-config
                  key: CLIENT_URL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: resource-app
  labels:
    app: resource-service
spec:
  type: ClusterIP
  selector:
    app: resource-service
  ports:
    - name: http
      port: 4001
      targetPort: 4001
