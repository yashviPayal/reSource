services:
  postgres:
    image: postgres:16-alpine
    container_name: resource-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resource_user
      POSTGRES_PASSWORD: resource_dev_password
      POSTGRES_DB: resource_db
    ports:
      - "5433:5432"
    volumes:
      - resource_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource_user -d resource_db"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  resource_pgdata:
