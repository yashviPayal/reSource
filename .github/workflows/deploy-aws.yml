name: Deploy Backend to AWS EC2 (K3s)

on:
  workflow_run:
    workflows: ["CI & DevSecOps Pipeline"]
    types:
      - completed
    branches:
      - main
      - master
      - microservices
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy-to-k3s:
    name: Deploy Microservices to AWS K3s Cluster
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve EC2 Public IP
        id: resolve-ip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ]; then
            echo "Using manual EC2_HOST secret: ${{ secrets.EC2_HOST }}"
            echo "ip=${{ secrets.EC2_HOST }}" >> $GITHUB_OUTPUT
          elif [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Querying AWS EC2 API for running instance with tag Name=cna-resource-k3s-node..."
            DISCOVERED_IP=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=cna-resource-k3s-node" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
            if [ -z "$DISCOVERED_IP" ] || [ "$DISCOVERED_IP" = "None" ]; then
              echo "Error: Could not find a running EC2 instance with tag Name=cna-resource-k3s-node"
              exit 1
            fi
            echo "Discovered running EC2 IP: $DISCOVERED_IP"
            echo "ip=$DISCOVERED_IP" >> $GITHUB_OUTPUT
          else
            echo "Error: Neither EC2_HOST nor AWS credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) are configured in GitHub Secrets."
            exit 1
          fi

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.resolve-ip.outputs.ip }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 300s
          script: |
            set -e
            echo "=== Connecting to EC2 K3s Cluster ==="

            # 1. Ensure project directory exists and pull latest code
            REPO_DIR="/home/ubuntu/reSource"
            if [ ! -d "$REPO_DIR" ]; then
              echo "Cloning repository..."
              git clone "https://github.com/${{ github.repository }}.git" "$REPO_DIR"
              cd "$REPO_DIR"
            else
              echo "Pulling latest changes from main..."
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            # 2. Ensure KUBECONFIG is loaded
            export KUBECONFIG="/home/ubuntu/.kube/config"

            # 3. Create or ensure resource-app namespace exists
            kubectl apply -f k8s/00-namespace.yaml

            # 4. Inject Production Secrets from GitHub Secrets into Kubernetes directly
            # This completely avoids writing credentials to plaintext files!
            echo "Updating Kubernetes production secrets (Supabase DB, JWT, Resend)..."
            kubectl create secret generic resource-secrets \
              --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              --from-literal=RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
              -n resource-app --dry-run=client -o yaml | kubectl apply -f -

            # 5. Build Docker container images locally on EC2
            echo "Building backend microservice images..."
            docker compose -f backend/docker-compose.yml build

            # 6. Import images into K3s containerd runtime
            echo "Importing images into K3s containerd..."
            docker save cna-resource-auth-service:latest | sudo k3s ctr images import -
            docker save cna-resource-resource-service:latest | sudo k3s ctr images import -
            docker save cna-resource-claim-service:latest | sudo k3s ctr images import -
            docker save cna-resource-notification-service:latest | sudo k3s ctr images import -
            docker save cna-resource-api-gateway:latest | sudo k3s ctr images import -

            # 7. Apply Kubernetes manifests (ConfigMaps, Services, Ingress, Deployments, HPA)
            echo "Applying Kubernetes manifests via Kustomize..."
            kubectl apply -k k8s/

            # 8. Trigger rolling restart of application microservices
            echo "Triggering zero-downtime rolling restart..."
            kubectl rollout restart deployment/api-gateway deployment/auth-service deployment/resource-service deployment/claim-service deployment/notification-service -n resource-app

            # 9. Verify deployment status
            echo "Waiting for API Gateway deployment to become ready..."
            kubectl rollout status deployment/api-gateway -n resource-app --timeout=180s

            echo "=== Deployment Successful! Current Pod Status ==="
            kubectl get pods -n resource-app -o wide
            kubectl get svc,ingress -n resource-app
